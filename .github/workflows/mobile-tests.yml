name: Mobile Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel outdated runs on the same branch — saves CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Android SDK tooling)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gates (ESLint + Prettier + typecheck)
        run: npm run check

      # Fix for "Software CPU emulation (-accel off) is not supported":
      # grant the runner user access to /dev/kvm so the emulator can use
      # hardware acceleration (documented in android-emulator-runner README)
      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android emulator and run the test suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64 # CI runners are x86_64 (the local AVD uses arm64)
          profile: pixel_6
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            adb devices
            npx appium driver list --installed
            # aapt2 is needed by the UiAutomator2 driver to parse the APK
            yes | sdkmanager "build-tools;34.0.0" > /dev/null 2>&1 || true
            npm run test:android

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # Raw results let the Pages job regenerate the report with history
      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

  publish-report:
    name: Publish Allure report to GitHub Pages
    needs: android
    # Only for main-branch pushes — PR runs must not overwrite the site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push to the gh-pages branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Allure results from the test job
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      # Restore history from the previous deployment to keep trends.
      # The gh-pages branch does not exist on the very first run.
      - name: Restore Allure history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Merge history into results
        run: |
          mkdir -p allure-results/history
          cp -r gh-pages/history/* allure-results/history/ 2>/dev/null || true

      - name: Generate Allure report with history
        run: npx allure generate allure-results --clean -o allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./allure-report
          commit_message: 'Deploy Allure report for ${{ github.sha }}'
